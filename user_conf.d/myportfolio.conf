# Rate limit: only count POST requests toward the timeline_post zone (GET
# requests, used to load the post list, map to an empty key and are
# therefore exempt from limit_req - see nginx docs on empty-key behavior).
map $request_method $timeline_post_limit_key {
    POST $binary_remote_addr;
    default "";
}

# 1 request per minute per IP.
limit_req_zone $timeline_post_limit_key zone=timeline_post_limit:10m rate=1r/m;

server {
    # Listen for HTTPS traffic at port 443.
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name ghadi.duckdns.org;

    # Certificate files generated and renewed automatically by certbot.
    ssl_certificate         /etc/letsencrypt/live/ghadi.duckdns.org/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/ghadi.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ghadi.duckdns.org/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # Rate limit POST /api/timeline_post to 1 request per minute per IP so
    # the endpoint can't be abused. GET requests (used to load the post
    # list) are unaffected.
    location = /api/timeline_post {
        limit_req zone=timeline_post_limit;
        limit_req_status 429;

        proxy_pass http://myportfolio:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy traffic to our myportfolio container port 5000.
    location / {
        proxy_pass http://myportfolio:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Note: the HTTP (port 80) listener, the 301 redirect to HTTPS, and the
# /.well-known/acme-challenge/ location used by Let's Encrypt are already
# provided globally by the jonasal/nginx-certbot base image, so they don't
# need to be duplicated here.
