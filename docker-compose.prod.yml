services:
  myportfolio:
    container_name: myportfolio
    build: .
    image: myportfolio:prod
    restart: unless-stopped
    environment:
      - URL=localhost:5000
      - MYSQL_HOST=mysql
      - MYSQL_USER=myportfolio
      - MYSQL_PASSWORD=mypassword
      - MYSQL_DATABASE=myportfoliodb
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 150M

  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - myportfolio
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  mysql:
    container_name: mysql
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=xakReQSfNsYpDSrYC5UlBNXk
      - MYSQL_DATABASE=myportfoliodb
      - MYSQL_USER=myportfolio
      - MYSQL_PASSWORD=mypassword
    volumes:
      - mydatabase:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 300M

volumes:
  mydatabase:
